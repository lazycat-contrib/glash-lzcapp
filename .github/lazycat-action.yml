version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/glash.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: glash

build:
  run_buildscript: false

images:
  - id: glash
    target: service
    service: glash
    source: gangz1o/glash
    channel: stable
    sort: semver
    tag_regex: '^v?\d+\.\d+\.\d+$'
    delivery:
      mode: mirror

stores:
  official:
    enabled: false
    skip_if_version_exists: true
  private:
    enabled: true
    skip_if_version_exists: true
    name: Glash
    summary: "Mihomo-based proxy service with web dashboard, supporting HTTP/SOCKS5 proxy and subscription auto-update"
